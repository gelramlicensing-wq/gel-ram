[workspace]
resolver = "2"
members = [
  "crates/gel-core",
  "crates/gel-orb",
  "crates/gel-kernel",
  "crates/gel-reader",
  "crates/gel-structural",
  "crates/gel-store",
  "crates/gel-physics",
  "crates/gel-bench",
  "crates/gel-cli",
  "xtask",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.85"
publish = false
license = "PolyForm-Noncommercial-1.0.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
